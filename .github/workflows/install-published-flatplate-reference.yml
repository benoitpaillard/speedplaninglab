name: Install finished published flat-plate reference

on:
  push:
    paths:
      - .github/workflows/install-published-flatplate-reference.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace provisional TN-2981 panel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('streamlit_app.py')
          text = path.read_text()

          old = '''from tn2981_digitized import render_tn2981_digitized

render_tn2981_digitized(
    speed_kmh=speed,
    width_m=beam,
    running_angle_deg=r["trim_deg"],
    current_clb=r["cl"],
    current_water_drag_n=r["water_resistance_n"],
    current_wetted_length_m=r["wetted_length_m"],
    water_density=rho_w,
)
'''
          new = '''from published_flatplate_reference import render_published_flatplate_reference

render_published_flatplate_reference(
    speed_kmh=speed,
    width_m=beam,
    bottom_v_deg=beta,
    running_angle_deg=r["trim_deg"],
    current_lift_coeff=r["cl"],
    current_water_drag_n=r["water_resistance_n"],
    current_wetted_length_m=r["wetted_length_m"],
    water_density=rho_w,
    water_kinematic_viscosity=nu_w,
)
'''
          if old not in text:
              raise SystemExit('Could not find provisional TN-2981 block')
          text = text.replace(old, new, 1)

          # Manufacturing constraint established for the record-board project.
          text = text.replace('length=1.72,', 'length=1.55,', 1)
          text = text.replace('lcg=0.30,', 'lcg=0.25,', 1)

          path.write_text(text)
          PY
      - name: Check syntax
        run: python -m py_compile streamlit_app.py published_flatplate_reference.py experimental_benchmarks.py smart_optimizer.py
      - name: Commit dashboard integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Use experiment-driven flat-plate reference"
          git push

name: Polish final rider-facing messages

on:
  push:
    paths:
      - .github/workflows/friendly-labels-final.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish wording
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('streamlit_app.py')
          text = path.read_text()
          text = re.sub(
              r'"OpenPlaning 0\.4\.8 is installed\. The compact screening solver remains "\s*"active while the extreme-regime adapter is validated\."',
              '"OpenPlaning 0.4.8 is installed. The fast comparison model is active while the extreme-speed setup is validated."',
              text,
          )
          text = text.replace('RuntimeError("No trim equilibrium in 0.12–8°")', 'RuntimeError("Could not find a stable board running angle between 0.12° and 8°")')
          text = text.replace('st.error(f"Model solve failed: {e}")', 'st.error(f"Could not calculate this setup: {e}")')
          path.write_text(text)
          PY
      - name: Check syntax
        run: python -m py_compile streamlit_app.py
      - name: Commit wording
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Polish rider-facing messages"
          git push

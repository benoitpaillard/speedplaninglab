name: Install record board V1

on:
  push:
    paths:
      - .github/workflows/install-record-board-v1.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V1 patch
        run: python tools/apply_record_board_v1.py
      - name: Check syntax
        run: python -m py_compile streamlit_app.py smart_optimizer.py record_board_design.py published_flatplate_reference.py experimental_benchmarks.py
      - name: Commit installation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py smart_optimizer.py
          git commit -m "Use evidence-driven record board V1"
          git push

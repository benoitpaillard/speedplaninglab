name: Install TN-2981 digitized comparison

on:
  push:
    paths:
      - .github/workflows/install-tn2981-digitized.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire measured data into dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('streamlit_app.py')
          text = path.read_text()
          marker = 'render_experimental_benchmarks(\n    speed_kmh=speed,\n    width_m=beam,\n    bottom_v_deg=beta,\n    running_angle_deg=r["trim_deg"],\n)\n'
          addition = marker + '\nfrom tn2981_digitized import render_tn2981_digitized\n\nrender_tn2981_digitized(\n    speed_kmh=speed,\n    width_m=beam,\n    running_angle_deg=r["trim_deg"],\n    current_clb=r["cl"],\n    current_water_drag_n=r["water_resistance_n"],\n    current_wetted_length_m=r["wetted_length_m"],\n    water_density=rho_w,\n)\n'
          if 'render_tn2981_digitized(' not in text:
              if marker not in text:
                  raise SystemExit('Could not find benchmark insertion point')
              text = text.replace(marker, addition, 1)
          path.write_text(text)
          PY
      - name: Check syntax and data
        run: |
          python -m py_compile streamlit_app.py experimental_benchmarks.py tn2981_digitized.py
          python - <<'PY'
          import csv
          p = 'data/experiments/tn2981/table_i_trim_2deg.csv'
          with open(p, newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) >= 15
          assert {'CA','Cv','CR','lm_over_b','CLb','CDb'}.issubset(rows[0].keys())
          print('TN-2981 rows:', len(rows))
          PY
      - name: Commit dashboard wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Show digitized TN-2981 measurements"
          git push

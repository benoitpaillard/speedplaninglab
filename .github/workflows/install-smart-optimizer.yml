name: Install smart optimizer UI

on:
  push:
    paths:
      - .github/workflows/install-smart-optimizer.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add optimizer to dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('streamlit_app.py')
          text = path.read_text()
          text = text.replace(
              'st.subheader("Board width × balance point search")',
              'st.subheader("Simple width × balance point search")',
          )

          marker = '''st.divider()\nst.info(\n    "Future simulation integration: the high-fidelity model should replace/calibrate the load "'''
          insertion = '''from smart_optimizer import render_smart_optimizer\n\nrender_smart_optimizer(\n    evaluate=evaluate,\n    base_params=params,\n    board_length=length,\n    current_width=beam,\n    current_center_of_gravity=lcg,\n    current_bottom_v=beta,\n    current_tow_angle=tow,\n)\n\nst.divider()\nst.info(\n    "Future simulation integration: the high-fidelity model should replace/calibrate the load "'''

          if 'render_smart_optimizer(' not in text:
              if marker not in text:
                  raise SystemExit('Could not find insertion point')
              text = text.replace(marker, insertion, 1)

          path.write_text(text)
          PY
      - name: Check syntax
        run: |
          python -m py_compile streamlit_app.py smart_optimizer.py
      - name: Commit optimizer wiring
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Wire smart optimizer into dashboard"
          git push

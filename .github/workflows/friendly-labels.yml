name: Apply wakeboarder-friendly labels

on:
  push:
    paths:
      - .github/workflows/friendly-labels.yml

permissions:
  contents: write

jobs:
  relabel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite remaining user-facing label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('streamlit_app.py')
          text = path.read_text()
          text = text.replace(
              'OpenPlaning 0.4.8 is installed. The compact screening solver remains active while the extreme-regime adapter is validated.',
              'OpenPlaning 0.4.8 is installed. The fast comparison model is active while the extreme-speed setup is validated.'
          )
          path.write_text(text)
          PY
      - name: Check syntax
        run: python -m py_compile streamlit_app.py
      - name: Commit labels
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Clean rider-facing status text"
          git push
